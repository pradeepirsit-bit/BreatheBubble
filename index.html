<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breathe Bubble</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --bubble-inhale: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --bubble-hold: linear-gradient(135deg, #00f2fe 0%, #000c40 100%);
            --bubble-exhale: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
            --ring-color: rgba(255, 255, 255, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Container to stack the SVG ring and the HTML bubble perfectly */
        .stage {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* The Timer Ring (SVG) */
        .timer-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg); /* Start at 12 o'clock */
            pointer-events: none;
        }

        .timer-ring {
            fill: none;
            stroke: var(--ring-color);
            stroke-width: 4;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.1s linear, stroke 0.5s ease;
        }

        /* The Core Visual Bubble */
        .bubble {
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: var(--bubble-inhale);
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.2);
            transform: scale(0.2); /* Initial resting state */
            transition: transform 0.1s linear, background 0.8s ease, box-shadow 0.8s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            will-change: transform;
        }

        /* Instruction Text Overlay */
        .instruction {
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 2px;
            opacity: 0.8;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        /* Optical Haptic Pulse Ring */
        .haptic-pulse {
            position: absolute;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            animation: ripple 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes ripple {
            0% {
                width: 280px;
                height: 280px;
                opacity: 0.8;
            }
            100% {
                width: 420px;
                height: 420px;
                opacity: 0;
            }
        }

        /* Subtle micro-vibration for the Hold Phase */
        @keyframes subtle-tremor {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(0.995); }
        }

        .tremor {
            animation: subtle-tremor 0.15s infinite alternate ease-in-out;
        }
        
        .hint {
            color: rgba(255, 255, 255, 0.4);
            margin-top: 2rem;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="stage" id="stage">
        <svg class="timer-svg">
            <circle class="timer-ring" id="ring" cx="200" cy="200" r="150"></circle>
        </svg>
        
        <div class="bubble" id="bubble">
            <div class="instruction" id="text">TAP TO START</div>
        </div>
    </div>

    <div class="hint">Tap anywhere to pause / resume</div>

    <script>
        const stage = document.getElementById('stage');
        const bubble = document.getElementById('bubble');
        const text = document.getElementById('text');
        const ring = document.getElementById('ring');

        // SVG Progress Ring Math Setup
        const radius = ring.r.baseVal.value;
        const circumference = radius * 2 * Math.PI;
        ring.style.strokeDasharray = `${circumference} ${circumference}`;
        ring.style.strokeDashoffset = circumference;

        // 4-7-8 Pattern Timings (in milliseconds)
        const PHASES = [
            { name: 'INHALE', duration: 4000, color: 'inhale', baseScale: 0.2, targetScale: 1.0 },
            { name: 'HOLD', duration: 7000, color: 'hold', baseScale: 1.0, targetScale: 1.0 },
            { name: 'EXHALE', duration: 8000, color: 'exhale', baseScale: 1.0, targetScale: 0.2 }
        ];

        let currentPhaseIndex = 0;
        let isRunning = false;
        let animationFrameId = null;
        let phaseStartTime = null;
        let elapsedBeforePause = 0;

        function setProgress(percent) {
            // Adjusts the SVG stroke offset based on timeline completion
            const offset = circumference - (percent * circumference);
            ring.style.strokeDashoffset = offset;
        }

        function triggerHapticVisual() {
            const pulse = document.createElement('div');
            pulse.classList.add('haptic-pulse');
            stage.appendChild(pulse);
            
            // Clean up the pulse element after animation ends
            pulse.addEventListener('animationend', () => pulse.remove());
        }

        function updateAnimation(timestamp) {
            if (!isRunning) return;
            if (!phaseStartTime) phaseStartTime = timestamp - elapsedBeforePause;

            const elapsed = timestamp - phaseStartTime;
            const currentPhase = PHASES[currentPhaseIndex];
            
            // Calculate progress normalized between 0 and 1
            let progress = Math.min(elapsed / currentPhase.duration, 1);

            // 1. Dynamic Scaling Engine
            let scale;
            if (currentPhase.name === 'INHALE') {
                // Ease out curve: fast start, slow landing at peak expansion
                const t = 1 - Math.pow(1 - progress, 3);
                scale = currentPhase.baseScale + (currentPhase.targetScale - currentPhase.baseScale) * t;
                setProgress(progress); 
            } else if (currentPhase.name === 'HOLD') {
                scale = currentPhase.baseScale;
                // Ring stays full but slowly cross-fades opacity to mimic content filling inside
                setProgress(1);
            } else if (currentPhase.name === 'EXHALE') {
                // Linear to controlled contraction down to core
                scale = currentPhase.baseScale - (currentPhase.baseScale - currentPhase.targetScale) * progress;
                setProgress(1 - progress); // Deplete countdown ring counter-clockwise
            }

            bubble.style.transform = `scale(${scale})`;

            // Check if current timer segment is complete
            if (elapsed >= currentPhase.duration) {
                // Trigger visual haptic cue at phase boundaries
                triggerHapticVisual();
                
                // Advance state engine
                currentPhaseIndex = (currentPhaseIndex + 1) % PHASES.length;
                phaseStartTime = timestamp;
                elapsedBeforePause = 0;
                
                // Cycle visual states
                applyPhaseStyles(PHASES[currentPhaseIndex]);
            }

            animationFrameId = requestAnimationFrame(updateAnimation);
        }

        function applyPhaseStyles(phase) {
            text.innerText = phase.name;
            
            // Handle context specific themes based on design directives
            if (phase.name === 'INHALE') {
                bubble.style.background = 'var(--bubble-inhale)';
                bubble.style.boxShadow = '0 0 60px rgba(0, 242, 254, 0.4)';
                ring.style.stroke = 'rgba(0, 242, 254, 0.6)';
                bubble.classList.remove('tremor');
            } else if (phase.name === 'HOLD') {
                bubble.style.background = 'var(--bubble-hold)';
                bubble.style.boxShadow = '0 0 60px rgba(255, 255, 255, 0.2)';
                ring.style.stroke = 'rgba(255, 255, 255, 0.7)';
                // Apply subtle vibrating micro-haptic
                bubble.classList.add('tremor');
            } else if (phase.name === 'EXHALE') {
                bubble.style.background = 'var(--bubble-exhale)';
                bubble.style.boxShadow = '0 0 60px rgba(255, 8, 68, 0.3)';
                ring.style.stroke = 'rgba(255, 8, 68, 0.5)';
                bubble.classList.remove('tremor');
            }
        }

        function toggleSession() {
            if (isRunning) {
                // Pause Engine
                isRunning = false;
                cancelAnimationFrame(animationFrameId);
                elapsedBeforePause = performance.now() - phaseStartTime;
                text.innerText = "PAUSED";
                bubble.classList.remove('tremor');
            } else {
                // Start / Resume Engine
                isRunning = true;
                text.innerText = PHASES[currentPhaseIndex].name;
                applyPhaseStyles(PHASES[currentPhaseIndex]);
                animationFrameId = requestAnimationFrame(updateAnimation);
            }
        }

        // Event Hook
        stage.addEventListener('click', toggleSession);
    </script>
</body>
</html>
